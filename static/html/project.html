<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar d-flex flex-column flex-md-row align-items-center p-2">
            <img src="../img/TGM_Logo.svg" alt="TGM Logo" class="logo" width="130">
            <div class="nav m-1">
                <button onclick="location.href='../index.html'" class="btn btn-outline-primary">Startseite</button>
            </div>
            <div class="nav m-1">
                <button onclick="location.href='contact_us.html'" class="btn btn-outline-primary">Kontakt</button>
            </div>
            <div class="nav m-1">
                <button onclick="location.href='project.html'" class="btn btn-outline-primary">Projects</button>
            </div>
        </nav>

        <style>
            #myToast {
                border-radius: 10px;
                backdrop-filter: blur(6px);
                background-color: rgba(0, 128, 0, 0.7);
                color: #fff;
                border: 2px solid rgba(0, 100, 0, 0.9);
                font-weight: bold; 
            }
        </style>
    </header>

    <main>
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card">
                    <img class="card-img-top" src="../img/elden_ring.png" alt="Card image">
                    <div class="card-body">
                        <div>
                            <h5 class="card-title">Elden Ring Website</h5>
                            <a href="../projects/elden_ring/index.html" class="btn btn-primary btn-sm">siehe Website</a>
                        </div>
                        <i class="bi bi-clipboard" onclick="copyToClipboard(this)"></i>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card">
                    <img class="card-img-top" src="../img/about_me.png" alt="Card image" width="400px">
                    <div class="card-body">
                        <div>
                            <h5 class="card-title">Gk2 vom letzten Jahr</h5>
                            <a href="../projects/GK2_letztes_Jahr/index.html" class="btn btn-primary btn-sm">siehe Website</a>
                        </div>
                        <i class="bi bi-clipboard" onclick="copyToClipboard(this)"></i>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card">
                    <img class="card-img-top" src="../img/tasks_manager.png" alt="Card image" width="400px">
                    <div class="card-body">
                        <div>
                            <h5 class="card-title">Tasks Manager</h5>
                            <a href="https://github.com/Stormrize/tasks_manager" class="btn btn-primary btn-sm">siehe GitHub</a>
                        </div>
                        <i class="bi bi-clipboard" onclick="copyToClipboard(this)"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Nachricht</strong>
                <small>jetzt</small>
                <button type="button" class="btn-close ms-2 mb-1" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                Schaut euch meine Elden Ring-Seite an!
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="copyToast" class="toast" role="banner" aria-live="polite" aria-atomic="true" >
            <div class="toast-header">
                <strong class="me-auto">copied</strong>
            </div>
            <div class="toast-body">
                Inhalt in Zwischenablage kopiert!
            </div>
        </div>
    </div>

    <footer class="text-end" style="color:grey; padding: 10px;">
        <h6>Impressum / Datenschutz</h6>
        <h6>© 2025 Monke Vladyslav</h6>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const toastEl = document.getElementById('myToast');
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    </script>
    <script src="../javascript/copy_to_clipboard.js" defer></script> 
    <script src="../javascript/javascript.js" defer></script>
</body>
</html>
