<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar d-flex flex-column flex-md-row align-items-center p-2">
            <img src="../img/TGM_Logo.svg" alt="TGM Logo" class="logo" width="130">
            <div class="nav m-1">
                <button onclick="location.href='../index.html'" class="btn btn-outline-primary">Startseite</button>
            </div>
            <div class="nav m-1">
                <button onclick="location.href='contact_us.html'" class="btn btn-outline-primary">Kontakt</button>
            </div>
            <div class="nav m-1">
                <button id="showToastBtn" onclick="location.href='project.html'" class="btn btn-outline-primary">Projects</button>
            </div>
        </nav>
        <style>
            .col-12, .col-6 {
                padding: 7px 15px 7px 15px;
            }
            .error {
                display: none;
            }

            .bi {
                border: none;
                background: #f1f3f5;
                padding: 0 10px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 0 6px 6px 0;
                transition: all 0.2s ease;
            }

            .bi i {
                font-size: 18px;
                color: #495057;
            }

            .bi:hover {
                background: #dee2e6;
            }

            .info-card {
                max-width: 600px;
                margin: 30px auto;
                padding: 25px 30px;
                background: #ffffff;
                border-radius: 12px;
                box-shadow: 0 8px 25px rgba(0,0,0,0.08);
                font-family: system-ui, sans-serif;
            }

            .info-card h3 {
                margin-bottom: 20px;
                font-weight: 600;
                color: #343a40;
            }

            .info-row {
                display: flex;
                justify-content: space-between;
                padding: 10px 0;
                border-bottom: 1px solid #f1f3f5;
            }

            .info-row span {
                font-weight: 600;
                color: #495057;
            }

            .info-row p {
                margin: 0;
                color: #212529;
                text-align: right;
            }

            .info-row.message {
                flex-direction: column;
                gap: 6px;
            }

            .info-row.message p {
                text-align: left;
                background: #f8f9fa;
                padding: 10px;
                border-radius: 6px;
            }
        </style>
    </header>
    <main>
        <form id="form">
            <div class="row">
                <div class="col-12">
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="klasse">
                            <i class="bi bi-person-lines-fill"></i>
                        </label>
                        <select id="klasse" name="klasse" class="form-control">
                            <option value="" disabled selected hidden>Anrede auswählen</option>
                            <option>Herr</option>
                            <option>Frau</option>
                            <option>Divers</option>
                            <option>Keine Angabe</option>
                        </select>
                    </div>
                </div>

                <div class="col-12 input-group mb-3">  
                    <label class="input-group-text" for="Betreff">
                        <i class="bi bi-file-text-fill"></i>
                    </label>
                    <input type="text" id="Betreff" name="Betreff" class="form-control" placeholder="Betreff">
                </div>

                <div class="col-12 col-md-12 col-xl-6">
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="Vorname">
                            <i class="bi bi-person-fill"></i>
                        </label>
                        <input type="text" id="Vorname" name="Vorname" class="form-control" placeholder="Vorname">
                    </div>
                </div>

                <div class="col-12 col-md-12 col-xl-6">
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="Nachname">
                            <i class="bi bi-person-fill"></i>
                        </label>
                        <input type="text" id="Nachname" name="Nachname" class="form-control" placeholder="Nachname">
                    </div>
                </div>

                <div class="col-12 input-group mb-3">
                    <label class="input-group-text" for="Date">
                        <i class="bi bi-calendar-fill"></i>
                    </label>
                    <input type="date" id="Date" name="Date" class="form-control">
                </div>
                <p id="ageError" class="error hidden">Du musst mindestens 14 sein</p>

                <div class="col-12">
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="email">
                            <i class="bi bi-envelope-at-fill"></i>
                        </label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="E-Mail-Adresse">
                    </div>
                </div>

                <div class="col-12">
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="tel">
                            <i class="bi bi-telephone-fill"></i>
                        </label>
                        <input type="tel" id="tel" name="tel" class="form-control" placeholder="Telefonnummer">
                    </div>
                </div>

                <div class="col-12 text-center">
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="message">
                            <i class="bi bi-envelope-fill"></i>
                        </label>
                        <textarea id="message" name="message" rows="4" class="form-control" placeholder="Nachricht"></textarea>
                        <i class="bi bi-clipboard" onclick="paste_from_clipboard(this)"></i>
                    </div>
                </div>

                <div class="col-6 text-center mt-3">
                    <input type="reset" id="reset" name="reset" class="btn btn-secondar vcy" value="Zurücksetzen">
                </div>

                <div class="col-6 text-center mt-3">
                    <input type="submit" id="submit" name="submit" class="btn btn-primary" value="Absenden">
                </div>
            </div>
        </form>
        <div id="info-container" style="display:none">
            <div id="info" class="info-card">
                <h3>Ihre Angaben wurden erfolgreich übermittelt</h3>

                <div class="info-row"><span>Anrede:</span><p></p></div>
                <div class="info-row"><span>Betreff:</span><p></p></div>
                <div class="info-row"><span>Vorname:</span><p></p></div>
                <div class="info-row"><span>Nachname:</span><p></p></div>
                <div class="info-row"><span>Geburtstag:</span><p></p></div>
                <div class="info-row"><span>E-Mail:</span><p></p></div>
                <div class="info-row"><span>Telefon: l</span><p></p></div>
                <div class="info-row message"><span>Nachricht:</span><p></p></div>
            </div>
            <div class="nav m-1 d-flex justify-content-center">
                <button onclick="location.href='contact_us.html'" class="btn btn-outline-primary">Zurück zur Kontaktseite</button>
            </div>
        </div>
        

    </main>
    <footer class="text-end" style="color: grey">
        <h6>Impressum / Datenschutz</h6>
        <h6>© 2025 Monke Vladyslav</h6>
    </footer>
    <script src="../javascript/formular_logic.js" defer></script>
    <script src="../javascript/paste_from_clipboard.js" defer></script>
</body>
</html>
